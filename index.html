  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #21262d; --border: #30363d;
      --accent: #58a6ff; --green: #3fb950; --red: #f78166; --yellow: #e3b341;
      --purple: #d2a8ff; --text: #e6edf3; --muted: #8b949e; --dim: #484f58;
      --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; min-height: 100vh; padding: 20px 24px 40px; }

    /* ---- Header ---- */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { width: 40px; height: 40px; background: linear-gradient(135deg, #58a6ff 0%, #3fb950 100%); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .header-title h1 { font-size: 18px; font-weight: 700; }
    .header-title p { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .header-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 10px; font-size: 11px; font-weight: 700; color: var(--accent); }
    .meta-info { font-size: 11px; color: var(--muted); }

    /* ---- Status Bar ---- */
    .status-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 5px var(--green); flex-shrink: 0; }
    .dot.warn { background: var(--red); box-shadow: 0 0 5px var(--red); }

    /* ---- Section Divider ---- */
    .section { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .section-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; white-space: nowrap; }
    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* ---- Grid ---- */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

    /* ---- Card Base ---- */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); transition: border-color .2s, transform .15s; position: relative; overflow: hidden; }
    .card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--card-accent, var(--accent)), transparent); }
    .card-title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; font-weight: 600; margin-bottom: 12px; }
    .card-icon { position: absolute; top: 16px; right: 16px; font-size: 22px; opacity: .12; }

    /* ---- KPI Card ---- */
    .kpi-value { font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
    .kpi-sub { font-size: 11px; color: var(--muted); }

    /* ---- Compare Card ---- */
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .compare-item label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 3px; }
    .compare-item .val { font-size: 22px; font-weight: 700; }
    .diff-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .diff-val { font-weight: 700; }
    .diff-pct { font-size: 11px; color: var(--muted); }
    .pos { color: var(--green); }
    .neg { color: var(--red); }

    /* ---- Chart Card ---- */
    .card-wide { grid-column: span 2; }
    .card-full { grid-column: 1 / -1; }
    .chart-wrap { position: relative; height: 180px; }

    /* ---- Table Card ---- */
    .tbl-wrap { overflow-x: auto; max-height: 320px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th { position: sticky; top: 0; background: var(--surface2); color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border); }
    thead th:first-child { text-align: left; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 6px 8px; text-align: right; color: var(--text); }
    tbody td:first-child { text-align: left; color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-high { color: var(--red); font-weight: 600; }
    .tag-pos { color: var(--green); }
    .tag-neg { color: var(--red); }

    /* ---- Double Table ---- */
    .double-table { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .sub-table-title { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }

    /* ---- Click Compare ---- */
    .click-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .click-col { background: var(--surface2); border-radius: 8px; padding: 12px; }
    .click-col-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .click-metric { margin-bottom: 6px; }
    .click-metric label { font-size: 10px; color: var(--dim); display: block; }
    .click-metric .v { font-size: 16px; font-weight: 700; }
    .click-diff-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; }

    /* ---- Top App List ---- */
    .app-list { display: flex; flex-direction: column; gap: 6px; }
    .app-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border-radius: 6px; padding: 8px 10px; }
    .app-rank { font-size: 11px; color: var(--dim); font-weight: 700; width: 20px; flex-shrink: 0; }
    .app-name { font-size: 12px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 8px; }
    .app-rev { font-size: 13px; font-weight: 700; color: var(--green); flex-shrink: 0; }


    /* ---- Sortable Table ---- */
    thead th.sortable { cursor: pointer; user-select: none; }
    thead th.sortable:hover { color: var(--accent); }
    thead th.sortable::after { content: ' ⇅'; font-size: 9px; color: var(--dim); }
    thead th.sort-asc::after { content: ' ↑'; color: var(--accent); }
    thead th.sort-desc::after { content: ' ↓'; color: var(--accent); }




    /* ---- Rate Level Colors ---- */
    .rate-normal { color: var(--text); }
    .rate-yellow { color: #e3b341; font-weight: 600; }
    .rate-orange { color: #f0883e; font-weight: 600; }
    .rate-red { color: var(--red); font-weight: 700; }
    .suggest-add { color: var(--green); font-weight: 600; }
    .suggest-warn { color: #e3b341; font-weight: 600; }
    .suggest-reduce { color: #f0883e; font-weight: 600; }
    .suggest-urgent { color: var(--red); font-weight: 700; }
    .suggest-direct { color: var(--purple); font-weight: 600; }



    /* ---- Honor Title Animation ---- */
    @keyframes honorShimmer {
      0%   { color: #ffd700; filter: brightness(1) drop-shadow(0 0 4px #ffd700); }
      25%  { color: #fff176; filter: brightness(1.4) drop-shadow(0 0 12px #fff700); }
      50%  { color: #ffecb3; filter: brightness(1.8) drop-shadow(0 0 20px #ffffff); }
      75%  { color: #fff176; filter: brightness(1.4) drop-shadow(0 0 12px #fff700); }
      100% { color: #ffd700; filter: brightness(1) drop-shadow(0 0 4px #ffd700); }
    }
    .honor-title-glow {
      color: #ffd700;
      animation: honorShimmer 2s ease-in-out infinite;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      display: inline-block;
    }



    /* ---- Offer Status ---- */
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .status-active { background: rgba(63,185,80,.15); color: var(--green); }
    .status-auto_off { background: rgba(248,129,74,.15); color: var(--orange); }
    .status-block { background: rgba(248,81,73,.15); color: var(--red); }

    .nav-tab { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; font-weight: 600; padding: 10px 24px; cursor: pointer; transition: all .15s; text-decoration: none; }

    .am-filter-bar { grid-column: 1/-1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .am-filter-label { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .am-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; color: var(--muted); font-size: 11px; padding: 3px 12px; cursor: pointer; transition: all .15s; user-select: none; }
    .am-chip:hover { border-color: var(--accent); color: var(--accent); }
    .am-chip.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }

    .filter-input:focus { border-color: var(--accent); }
    .filter-btn { background: var(--accent); border: none; border-radius: 5px; color: #000; font-size: 11px; font-weight: 600; padding: 4px 12px; cursor: pointer; }
    .filter-btn:hover { opacity: .85; }
    .filter-clear { background: none; border: 1px solid var(--border); border-radius: 5px; color: var(--muted); font-size: 11px; padding: 4px 10px; cursor: pointer; }
    .filter-clear:hover { border-color: var(--red); color: var(--red); }

    /* ---- Download Button ---- */
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-header .card-title { margin-bottom: 0; }
    .download-btn { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-size: 10px; padding: 2px 8px; cursor: pointer; transition: all .15s; white-space: nowrap; }

    .fraud-ignore-btn:hover { border-color: var(--red); color: var(--red); }

    .fraud-restore-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; color: var(--accent); font-size: 11px; padding: 4px 12px; cursor: pointer; margin-bottom: 10px; }
    .fraud-restore-btn:hover { border-color: var(--accent); }
    tr.ignored-row td { opacity: 0.35; }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .card-wide, .card-full { grid-column: span 1; } .double-table, .click-compare { grid-template-columns: 1fr; } }

  function buildFraudTable(rows, date, ignoreSet, cardEl) {
    var tbody = cardEl.querySelector('tbody');
    if (!tbody) return;

    var active = rows.filter(function(r) { return !ignoreSet.has(r.prod + '|' + r.manager + '|' + date); });

    active.concat(ignored).forEach(function(r) {
      var key = r.prod + '|' + r.manager + '|' + date;

      tr.innerHTML =

  function downloadTableCSV(cardEl, filename) {
    var table = cardEl.querySelector('table');
    if (!table) return;
    var nl = String.fromCharCode(10);
    var rows = [];
    var headers = Array.from(table.querySelectorAll('thead th')).map(function(th) {
      return '"' + th.textContent.trim().replace(/"/g, '""') + '"';
    });
    var startCol = (headers[0] === '""') ? 1 : 0;
    rows.push(headers.slice(startCol).join(','));
    table.querySelectorAll('tbody tr').forEach(function(tr) {
      var cells = Array.from(tr.querySelectorAll('td')).slice(startCol).map(function(td) {
        return '"' + td.textContent.trim().replace(/"/g, '""') + '"';
      });
      rows.push(cells.join(','));
    });
    var csv = rows.join(nl);
    var blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename + '.csv';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function addTableFilter(cardEl, filterCols) {
    var table = cardEl.querySelector('table');
    if (!table) return;
    var tblWrap = cardEl.querySelector('.tbl-wrap');
    if (!tblWrap) return;
    var filterDiv = document.createElement('div');
    filterDiv.className = 'table-filter';
    var inputs = [];
    filterCols.forEach(function(fc) {
      var lbl = document.createElement('span');
      lbl.style.cssText = 'font-size:10px;color:var(--muted);';
      lbl.textContent = fc.label + ':';
      filterDiv.appendChild(lbl);
      var inp = document.createElement('input');
      inp.className = 'filter-input';
      inp.placeholder = fc.placeholder;
      inp.dataset.colIndex = fc.colIndex;
      filterDiv.appendChild(inp);
      inputs.push(inp);
    });
    var btnSearch = document.createElement('button');
    btnSearch.className = 'filter-btn';
    btnSearch.textContent = '🔍 搜索';
    filterDiv.appendChild(btnSearch);
    var btnClear = document.createElement('button');
    btnClear.className = 'filter-clear';
    btnClear.textContent = '清除';
    filterDiv.appendChild(btnClear);
    var countEl = document.createElement('span');
    countEl.style.cssText = 'font-size:10px;color:var(--muted);margin-left:4px;';
    filterDiv.appendChild(countEl);
    cardEl.insertBefore(filterDiv, tblWrap);
    function doFilter() {
      var filters = inputs.map(function(inp) {
        return { colIdx: parseInt(inp.dataset.colIndex), val: inp.value.trim().toLowerCase() };
      }).filter(function(f) { return f.val !== ''; });
      var rows = Array.from(table.querySelectorAll('tbody tr'));
      var visible = 0;
      rows.forEach(function(tr) {
        var show = filters.every(function(f) {
          var cell = tr.querySelectorAll('td')[f.colIdx];
          return cell && cell.textContent.toLowerCase().includes(f.val);
        });
        tr.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      countEl.textContent = filters.length > 0 ? ('显示 ' + visible + '/' + rows.length + ' 行') : '';
    }
    btnSearch.addEventListener('click', doFilter);
    inputs.forEach(function(inp) {
      inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') doFilter(); });
    });
    btnClear.addEventListener('click', function() {
      inputs.forEach(function(inp) { inp.value = ''; });
      table.querySelectorAll('tbody tr').forEach(function(tr) { tr.style.display = ''; });
      countEl.textContent = '';
    });
  }

  function mergeManagerData(managers) {
    // 合并多个 manager 的数据
    if (managers.length === 0) return null;
    if (managers.length === 1) return _byManager[managers[0]];
    
    var merged = JSON.parse(JSON.stringify(_byManager[managers[0]]));
    
    for (var i = 1; i < managers.length; i++) {
      var d = _byManager[managers[i]];
      if (!d) continue;

      // revenue_by_date
      var ry = parseFloat(merged.revenue_by_date.yesterday.replace(/[$,]/g,'')) + parseFloat(d.revenue_by_date.yesterday.replace(/[$,]/g,''));
      var rb = parseFloat(merged.revenue_by_date.day_before.replace(/[$,]/g,'')) + parseFloat(d.revenue_by_date.day_before.replace(/[$,]/g,''));
      var diff = ry - rb;
      var pct = rb > 0 ? diff/rb*100 : 0;
      merged.revenue_by_date = {
        yesterday: '$' + ry.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
        day_before: '$' + rb.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
        diff: (diff>=0?'+':'') + '$' + Math.abs(diff).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
        diff_pct: (pct>=0?'+':'') + pct.toFixed(1) + '%',
        is_positive: diff >= 0
      };

      // recent_revenue_trends - 合并 datasets
      var labels = merged.recent_revenue_trends.labels;
      var data0 = merged.recent_revenue_trends.datasets[0].data;
      var data1 = d.recent_revenue_trends.datasets[0].data;
      d.recent_revenue_trends.labels.forEach(function(dt, idx) {
        var li = labels.indexOf(dt);
        if (li > -1) { data0[li] = (data0[li]||0) + (data1[idx]||0); }
      });

      // today_revenue
      var tr = parseFloat(merged.today_revenue.today.replace(/[$,]/g,'')) + parseFloat(d.today_revenue.today.replace(/[$,]/g,''));
      var tys = parseFloat(merged.today_revenue.yesterday_same.replace(/[$,]/g,'')) + parseFloat(d.today_revenue.yesterday_same.replace(/[$,]/g,''));
      var tdiff = tr - tys;
      var tpct = tys > 0 ? tdiff/tys*100 : 0;
      merged.today_revenue = {
        today: '$' + tr.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
        yesterday_same: '$' + tys.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
        diff: (tdiff>=0?'+':'') + '$' + Math.abs(tdiff).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
        diff_pct: (tpct>=0?'+':'') + tpct.toFixed(1) + '%',
        is_positive: tdiff >= 0,
        cutoff_hour: merged.today_revenue.cutoff_hour
      };

      // 数组类型直接合并
      ['revenue_by_prt','fraud_by_country','app_tracksource_click','today_rejection','fraud_alert_yesterday','revenue_by_am'].forEach(function(key) {
        if (d[key]) merged[key] = (merged[key]||[]).concat(d[key]);
      });
      // adv_am_app_top10
      if (d.adv_am_app_top10) {
        merged.adv_am_app_top10 = merged.adv_am_app_top10 || {increase:[], decrease:[]};
        merged.adv_am_app_top10.increase = (merged.adv_am_app_top10.increase||[]).concat(d.adv_am_app_top10.increase||[]);
        merged.adv_am_app_top10.decrease = (merged.adv_am_app_top10.decrease||[]).concat(d.adv_am_app_top10.decrease||[]);
      }

      // top_app 合并
      if (d.top_app) {
        merged.top_app.top_revenue = (merged.top_app.top_revenue||[]).concat(d.top_app.top_revenue||[]);
        merged.top_app.top_install = (merged.top_app.top_install||[]).concat(d.top_app.top_install||[]);
      }

      // track_source_click 合并
      if (d.track_source_click) {
        var ty = merged.track_source_click.yesterday;
        var dy = d.track_source_click.yesterday;
        var tb = merged.track_source_click.day_before;
        var db = d.track_source_click.day_before;
        ty.total_clicks = (ty.total_clicks||0) + (dy.total_clicks||0);
        ty.success_clicks = (ty.success_clicks||0) + (dy.success_clicks||0);
        tb.total_clicks = (tb.total_clicks||0) + (db.total_clicks||0);
        tb.success_clicks = (tb.success_clicks||0) + (db.success_clicks||0);
        ty.success_rate = ty.total_clicks > 0 ? (ty.success_clicks/ty.total_clicks*100).toFixed(1)+'%' : '--';
        tb.success_rate = tb.total_clicks > 0 ? (tb.success_clicks/tb.total_clicks*100).toFixed(1)+'%' : '--';
        var sdiff = (ty.success_clicks - tb.success_clicks) / 1e8;
        merged.track_source_click.sc_diff_yi = (sdiff>=0?'+':'') + sdiff.toFixed(2) + ' 亿';
        merged.track_source_click.sc_is_positive = sdiff >= 0;
      }

      // today_top_app 合并
      if (d.today_top_app) merged.today_top_app = (merged.today_top_app||[]).concat(d.today_top_app);
    }
    return merged;
  }

  function applyAMFilter() {
    var hint = document.getElementById('am-filter-hint');
    var _inOfferTab = document.getElementById('tab-offer') && document.getElementById('tab-offer').classList.contains('active');

    if (_activeManagers.length === 0) {
      if (_inOfferTab) {
        document.querySelectorAll('#offer-section table tbody tr').forEach(function(tr) { tr.style.display = ''; });
        rebuildAMBar();
      } else {
        renderAll();
        rebuildAMBar();
        initTableFilters(); addDownloadButtons(); enableAllSort();
      }
      return;
    }

    if (_inOfferTab) {
      document.querySelectorAll('#offer-section table tbody tr').forEach(function(tr) {
        var mgr = tr.querySelectorAll('td')[0] ? tr.querySelectorAll('td')[0].textContent.trim() : '';
        tr.style.display = _activeManagers.indexOf(mgr) > -1 ? '' : 'none';
      });
      rebuildAMBar();
      return;
    }

    // 合并选中 manager 的数据
    var merged = mergeManagerData(_activeManagers);
    if (!merged) return;
    if (hint) hint.textContent = '已选: ' + _activeManagers.join(', ');

    // 用合并数据替换对应卡片并重新渲染
    var overrideCards = JSON.parse(JSON.stringify(REPORT.cards));
    overrideCards.forEach(function(c) {
      if (merged[c.id] || (c.id === 'fraud_alert' && merged['fraud_alert_yesterday'])) {
        if (c.id === 'revenue_by_date') { Object.assign(c, merged[c.id]); }
        else if (c.id === 'recent_revenue_trends') { c.data = merged[c.id]; }
        else if (c.id === 'revenue_by_prt') { c.rows = merged[c.id]; }
        else if (c.id === 'top_app') { Object.assign(c, merged[c.id]); }
        else if (c.id === 'fraud_by_country') { c.rows = merged[c.id]; }
        else if (c.id === 'track_source_click') { Object.assign(c, merged[c.id]); }
        else if (c.id === 'app_tracksource_click') { c.rows = merged[c.id]; }
        else if (c.id === 'today_revenue') { Object.assign(c, merged[c.id]); }
        else if (c.id === 'today_top_app') { c.items = merged[c.id]; }
        else if (c.id === 'today_rejection') { c.rows = merged[c.id]; }
        else if (c.id === 'revenue_by_am') { c.rows = merged[c.id]; }
        else if (c.id === 'adv_am_app_top10') { Object.assign(c, merged[c.id]); }
        else if (c.id === 'today_app_diff') { Object.assign(c, merged[c.id]); }
        else if (c.id === 'click_overview') { Object.assign(c, merged[c.id]); }
        if (c.id === 'fraud_alert' && merged['fraud_alert_yesterday']) { c.yesterday = {rows: merged['fraud_alert_yesterday']||[], at_ids:[]}; c.today = {rows: merged['fraud_alert_yesterday']||[], at_ids:[]}; }
      }
    });

    // 临时替换 REPORT.cards 渲染
    var origCards = REPORT.cards;
    REPORT.cards = overrideCards;
    renderAll();
    REPORT.cards = origCards;
    requestAnimationFrame(function() {
      initTableFilters();
      addDownloadButtons();
      enableAllSort();
      setTimeout(function() { initFraudCards(); }, 100);
      // 在 initTableFilters 完成后再填入过滤框
      setTimeout(function() {
        var mgrVal = _activeManagers.length === 1 ? _activeManagers[0] : (_activeManagers.length > 1 ? _activeManagers.join('|') : '');
        if (!mgrVal) return;
        ['card-cam-y', 'card-cam-t', 'card-cost-y', 'card-cost-t', 'card-top-4w', 'card-pot-7d'].forEach(function(id) {
          var cardEl = document.getElementById(id);
          if (!cardEl) return;
          cardEl.querySelectorAll('.filter-input').forEach(function(inp) {
            if (inp.placeholder && inp.placeholder.indexOf('Manager') > -1) inp.value = mgrVal;
          });
          var btn = cardEl.querySelector('.filter-btn');
          if (btn) btn.click();
        });
      }, 300);
    });

    // 更新 AM Filter Bar 选中状态
    rebuildAMBar();

    // 同步过滤 offer 状态表格
    setTimeout(function() {
      ['offer-section'].forEach(function() {
        var tables = document.querySelectorAll('#offer-section table');
        tables.forEach(function(tbl) {
          tbl.querySelectorAll('tbody tr').forEach(function(tr) {
            if (_activeManagers.length === 0) {
              tr.style.display = '';
            } else {
              var managerCell = tr.querySelectorAll('td')[0];
              var mgr = managerCell ? managerCell.textContent.trim() : '';
              tr.style.display = _activeManagers.indexOf(mgr) > -1 ? '' : 'none';
            }
          });
        });
      });
    }, 400);
  }

  function rebuildAMBar() {
    var chipsEl = document.getElementById('am-chips');
    if (!chipsEl || !_managerList || _managerList.length === 0) return;
    chipsEl.innerHTML = '';
    _managerList.forEach(function(mgr) {
      var chip = document.createElement('span');
      chip.className = 'am-chip' + (_activeManagers.indexOf(mgr) > -1 ? ' active' : '');
      chip.textContent = mgr;
      chip.dataset.mgr = mgr;
      chip.addEventListener('click', function() {
        var idx = _activeManagers.indexOf(mgr);
        if (idx > -1) { _activeManagers.splice(idx, 1); chip.classList.remove('active'); }
        else { _activeManagers.push(mgr); chip.classList.add('active'); }
        applyAMFilter();
      });
      chipsEl.appendChild(chip);
    });
    var resetBtn = document.getElementById('am-reset-btn');
    if (resetBtn) {
      resetBtn.onclick = function() {
        _activeManagers = [];
        if (chipsEl) chipsEl.querySelectorAll('.am-chip').forEach(function(c) { c.classList.remove('active'); });
        applyAMFilter();
      };
    }
    var hint = document.getElementById('am-filter-hint');
    if (hint) hint.textContent = _activeManagers.length > 0 ? ('已选: ' + _activeManagers.join(', ')) : '可多选';
  }

  function initAMFilter() {
    cacheGlobalCards();
    rebuildAMBar();
  }


  // ── 执行率/成功率分级 ─────────────────────────────────────────────────
  function rateLevel(pctStr) {
    var v = parseFloat(pctStr);
    if (isNaN(v)) return 'normal';
    if (v >= 80) return 'normal';
    if (v >= 70) return 'yellow';
    if (v >= 60) return 'orange';
    return 'red';
  }

  function rateCls(pctStr) {
    return 'rate-' + rateLevel(pctStr);
  }

  function getSuggestion(execPct, successPct) {
    var e = rateLevel(execPct), s = rateLevel(successPct);
    if (e === 'normal' && s === 'normal') return ['可加量', 'suggest-add'];
    if (e === 'normal' && s === 'yellow') return ['注意限流', 'suggest-warn'];
    if (e === 'normal' && s === 'orange') return ['限流，建议降量', 'suggest-reduce'];
    if (e === 'normal' && s === 'red')    return ['限流，马上降量', 'suggest-urgent'];
    if (e === 'yellow' && s === 'normal') return ['可尝试直发', 'suggest-direct'];
    if (e === 'yellow' && s === 'yellow') return ['注意限流', 'suggest-warn'];
    if (e === 'yellow' && s === 'orange') return ['限流，建议降量', 'suggest-reduce'];
    if (e === 'yellow' && s === 'red')    return ['限流，马上降量', 'suggest-urgent'];
    if (e === 'orange' && s === 'normal') return ['可尝试直发', 'suggest-direct'];
    if (e === 'orange' && s === 'yellow') return ['可尝试直发，注意限流', 'suggest-direct'];
    if (e === 'orange' && s === 'orange') return ['限流，建议降量', 'suggest-reduce'];
    if (e === 'orange' && s === 'red')    return ['限流，马上降量', 'suggest-urgent'];
    if (e === 'red'    && s === 'normal') return ['沟通直发', 'suggest-direct'];
    if (e === 'red'    && s === 'yellow') return ['可尝试直发，注意限流', 'suggest-direct'];
    if (e === 'red'    && s === 'orange') return ['限流，建议降量', 'suggest-reduce'];
    if (e === 'red'    && s === 'red')    return ['限流，马上降量', 'suggest-urgent'];
    return ['--', ''];
  }

  // ── 通用表格排序 ──────────────────────────────────────────────────────
  function makeTableSortable(table) {
    var headers = table.querySelectorAll('thead th');
    var sortCol = -1, sortAsc = true;
    headers.forEach(function(th, colIdx) {
      th.classList.add('sortable');
      th.addEventListener('click', function() {
        if (sortCol === colIdx) {
          sortAsc = !sortAsc;
        } else {
          sortCol = colIdx;
          sortAsc = true;
        }
        headers.forEach(function(h) { h.classList.remove('sort-asc','sort-desc'); });
        th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
        var tbody = table.querySelector('tbody');
        var rows = Array.from(tbody.querySelectorAll('tr'));
        rows.sort(function(a, b) {
          var aCell = a.querySelectorAll('td')[colIdx];
          var bCell = b.querySelectorAll('td')[colIdx];
          var aVal = aCell ? aCell.textContent.trim() : '';
          var bVal = bCell ? bCell.textContent.trim() : '';
          // 去掉 $, %, , 等符号后尝试数字比较
          var aNum = parseFloat(aVal.replace(/[$%,\s]/g, ''));
          var bNum = parseFloat(bVal.replace(/[$%,\s]/g, ''));
          if (!isNaN(aNum) && !isNaN(bNum)) {
            return sortAsc ? aNum - bNum : bNum - aNum;
          }
          return sortAsc ? aVal.localeCompare(bVal, 'zh') : bVal.localeCompare(aVal, 'zh');
        });
        rows.forEach(function(r) { tbody.appendChild(r); });
      });
    });
  }

  // 对所有表格启用排序
  function enableAllSort() {
    document.querySelectorAll('table').forEach(function(t) { makeTableSortable(t); });
  }

  enableAllSort();
</script>
